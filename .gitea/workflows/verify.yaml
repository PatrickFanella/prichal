name: Verify local foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.6.0
      - name: Validate local runtime scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in scripts/*.mjs deploy/local/fixtures/*.mjs deploy/local/fixtures/*.cjs; do node --check "$script"; done
      - name: Start disposable PostgreSQL
        run: ./scripts/ci-db.sh start
      - name: Verify fixed public pilot recovery boundaries
        run: python3 -m unittest discover -s deploy/homelab -p 'test_public_pds_reconcile.py' -v
      - name: Verify retained public pilot certificate boundaries
        run: python3 -m unittest discover -s deploy/homelab -p 'test_public_pds_certificates.py' -v
      - name: Verify fixed public pilot telemetry boundaries and alert behavior
        run: |
          python3 -m unittest discover -s deploy/homelab -p 'test_public_pds_metrics.py' -v
          bash scripts/test-public-pds-alerts.sh
      - name: Verify fixed independent public pilot restore scope
        run: python3 -m unittest discover -s deploy/homelab -p 'test_public_pds_restore.py' -v
      - name: Build and clean-database smoke
        run: ./scripts/smoke.sh
      - name: Prepare customer CLI platform builds and verify Linux entry point
        run: |
          ./scripts/build-customer-cli.sh
          .local/cli-build/pds-ass-linux-amd64 --version
          .local/cli-build/pds-ass-linux-amd64 deploy --help
          .local/cli-build/pds-ass-linux-amd64 completion bash
          (cd .local/cli-build && sha256sum --check SHA256SUMS)
      - name: Stop disposable PostgreSQL
        if: always()
        run: ./scripts/ci-db.sh stop
