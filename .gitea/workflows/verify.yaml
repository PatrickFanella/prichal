name: Verify local foundation
# Pull-request verification runs on the GitHub organization mirror
# (.github/workflows/mirror-ci.yml, reported back as "GitHub CI / Mirror CI gate").
# This workflow keeps post-merge verification and the preview web deploy on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.6.0
      - name: Validate local runtime scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in scripts/*.mjs deploy/local/fixtures/*.mjs deploy/local/fixtures/*.cjs; do node --check "$script"; done
      - name: Start disposable PostgreSQL
        run: ./scripts/ci-db.sh start
      - name: Verify fixed public pilot recovery boundaries
        run: python3 -m unittest discover -s deploy/homelab -p 'test_public_pds_reconcile.py' -v
      - name: Verify retained public pilot certificate boundaries
        run: python3 -m unittest discover -s deploy/homelab -p 'test_public_pds_certificates.py' -v
      - name: Verify fixed public pilot telemetry boundaries and alert behavior
        run: |
          python3 -m unittest discover -s deploy/homelab -p 'test_public_pds_metrics.py' -v
          bash scripts/test-public-pds-alerts.sh
      - name: Verify fixed independent public pilot restore scope
        run: python3 -m unittest discover -s deploy/homelab -p 'test_public_pds_restore.py' -v
      - name: Verify private hosted-preview backup boundaries
        run: python3 -m unittest discover -s deploy/production -p 'test_preview_backup.py' -v
      - name: Verify managed routing snapshot scope
        run: python3 -m unittest discover -s deploy/homelab -p 'test_managed_routing_recovery.py' -v
      - name: Verify disposable managed conversion boundaries
        run: python3 -m unittest discover -s deploy/homelab -p 'test_managed_conversion.py' -v
      - name: Verify managed staging publisher boundaries
        run: python3 -m unittest discover -s deploy/homelab -p 'test_managed_publisher*.py' -v
      - name: Verify managed DNS route check
        run: python3 -m unittest discover -s deploy/homelab -p 'test_managed_dns.py' -v
      - name: Verify staging-02 retained-key certificate publication
        run: python3 -m unittest discover -s deploy/homelab -p 'test_staging_02_certificates.py' -v
      - name: Verify staging-02 certificate telemetry boundaries
        run: python3 -m unittest discover -s deploy/homelab -p 'test_staging_02_metrics.py' -v
      - name: Verify empty managed fixture preservation
        run: python3 -m unittest discover -s deploy/homelab -p 'test_managed_preservation.py' -v
      - name: Verify held managed fixture native retirement
        run: python3 -m unittest discover -s deploy/homelab -p 'test_managed_native_retirement.py' -v
      - name: Build and clean-database smoke
        run: ./scripts/smoke.sh
      - name: Prepare customer CLI platform builds and verify Linux entry point
        run: |
          ./scripts/build-customer-cli.sh
          .local/cli-build/pds-ass-linux-amd64 --version
          .local/cli-build/pds-ass-linux-amd64 deploy --help
          .local/cli-build/pds-ass-linux-amd64 completion bash
          (cd .local/cli-build && sha256sum --check SHA256SUMS)
      - name: Stop disposable PostgreSQL
        if: always()
        run: ./scripts/ci-db.sh stop
      - name: Reuse an already accepted web artifact
        id: artifact
        if: github.server_url == 'https://git.subcult.tv' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
            -o ConnectTimeout=15 onnwee@10.0.0.57)
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION web" > "$deploy_dir/artifact.json"
          python3 - "$deploy_dir/artifact.json" "$GITHUB_OUTPUT" <<'PYCODE'
          import json, re, sys
          from pathlib import Path
          info = json.loads(Path(sys.argv[1]).read_text())
          available = info.get("available") is True
          if available:
              assert re.fullmatch(r"[0-9a-f]{64}", info.get("html_sha256", ""))
          with Path(sys.argv[2]).open("a") as output:
              output.write("available=" + str(available).lower() + "\n")
              output.write("root_sha256=" + info.get("html_sha256", "") + "\n")
          PYCODE
      - name: Read the admitted management source
        id: management
        if: steps.artifact.outputs.available != 'true'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const pin = JSON.parse(readFileSync('deploy/production/web-release.json'));
          assert.equal(pin.schema_version, 1);
          assert.match(pin.management_revision, /^[0-9a-f]{40}$/);
          assert.ok(Number.isSafeInteger(pin.management_schema_version) && pin.management_schema_version > 0);
          appendFileSync(process.env.GITHUB_OUTPUT, `revision=${pin.management_revision}\n`);
          NODE
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.artifact.outputs.available != 'true'
        with:
          ref: ${{ steps.management.outputs.revision }}
          path: .ci-management-source
          persist-credentials: false
      - name: Build and qualify the accepted web image
        if: steps.artifact.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          image="fleet-deploy/prichal-web/web:$DEPLOY_REVISION"
          management_revision=$(git -C .ci-management-source rev-parse HEAD)
          test "$management_revision" = "${{ steps.management.outputs.revision }}"
          docker build -f deploy/production/web.Dockerfile \
            --build-arg MANAGEMENT_SOURCE=.ci-management-source/web \
            --build-arg "MANAGEMENT_REVISION=$management_revision" \
            --label "org.opencontainers.image.revision=$DEPLOY_REVISION" \
            --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/prichal" \
            -t "$image" .
          bash scripts/check-ci-web-image.sh "$image" "$DEPLOY_REVISION"
      - name: Deploy only the preview web listener and verify public HTML
        if: >-
          github.server_url == 'https://git.subcult.tv' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          REUSE_ARTIFACT: ${{ steps.artifact.outputs.available }}
          ACCEPTED_ROOT_SHA256: ${{ steps.artifact.outputs.root_sha256 }}
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
            -o ConnectTimeout=15 onnwee@10.0.0.57)
          ssh "${ssh_args[@]}" status
          image="fleet-deploy/prichal-web/web:$DEPLOY_REVISION"
          # The forced receiver accepts a full hexadecimal revision; expand it here.
          if [[ "$REUSE_ARTIFACT" != true ]]; then
            # shellcheck disable=SC2029
            docker save "$image" | ssh "${ssh_args[@]}" "receive $DEPLOY_REVISION web"
          fi
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "deploy $DEPLOY_REVISION"
          if [[ "$REUSE_ARTIFACT" != true ]]; then
            ACCEPTED_ROOT_SHA256=$(sha256sum site/index.html | cut -d ' ' -f 1)
          fi
          [[ "$ACCEPTED_ROOT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 \
            https://prichal.subcult.tv/ > "$deploy_dir/index.html"
          test "$(sha256sum "$deploy_dir/index.html" | cut -d ' ' -f 1)" = "$ACCEPTED_ROOT_SHA256"
          for asset in favicon.ico apple-touch-icon.png og.png; do
            curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 \
              "https://prichal.subcult.tv/$asset" > "$deploy_dir/$asset"
            cmp "site/$asset" "$deploy_dir/$asset"
          done
          printf 'Live Prichal landing HTML and icons match source %s\n' "$DEPLOY_REVISION"
