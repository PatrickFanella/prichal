name: Verify local foundation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: pds_ci
          POSTGRES_USER: pds_ci
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd "pg_isready -U pds_ci -d pds_ci"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      PDS_DATABASE_URL: postgres://pds_ci:disposable-ci-only@postgres:5432/pds_ci?sslmode=disable
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.6.0
      - name: Build and clean-database smoke
        run: ./scripts/smoke.sh
