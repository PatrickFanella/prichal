# Hosted preview on Dozor. Secrets come from /etc/prichal/production.env (owner-only).
# Only the web listener is published; PostgreSQL and the API stay on the internal network.
name: prichal
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: prichal
      POSTGRES_DB: prichal
      POSTGRES_PASSWORD: ${PRICHAL_DB_PASSWORD:?set in /etc/prichal/production.env}
    volumes:
      - management-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prichal -d prichal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
  api:
    image: prichal-api:${PRICHAL_REVISION:?release revision required}
    build:
      context: ../..
      dockerfile: deploy/production/api.Dockerfile
    environment:
      PDS_MODE: production
      PDS_LISTEN_ADDRESS: 0.0.0.0:8080
      PDS_DATABASE_URL: postgres://prichal:${PRICHAL_DB_PASSWORD}@postgres:5432/prichal?sslmode=disable
      PDS_PUBLIC_ORIGIN: https://prichal-app.subcult.tv
      PDS_OIDC_ISSUER: https://git.subcult.tv
      PDS_OIDC_CLIENT_ID: ${PRICHAL_OIDC_CLIENT_ID:?set in /etc/prichal/production.env}
      PDS_OIDC_CLIENT_SECRET: ${PRICHAL_OIDC_CLIENT_SECRET:?set in /etc/prichal/production.env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
  web:
    image: prichal-web:${PRICHAL_REVISION}
    build:
      context: ../..
      dockerfile: deploy/production/web.Dockerfile
    ports:
      - "10.0.0.57:3090:80"
    depends_on: [api]
    networks: [internal, egress]
    read_only: true
    tmpfs: [/config, /data]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
networks:
  internal:
    internal: true
  egress: {}
volumes:
  management-data:
