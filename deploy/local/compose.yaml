name: pds-ass-runtime
services:
  pds:
    image: ghcr.io/bluesky-social/pds:0.4@sha256:95d6179bc9fb10cc36ccd6dea0407fc6d99f21374bf2a1f9e8f28c0427c7e336
    env_file: ../../.local/pds.env
    environment:
      PDS_HOSTNAME: localhost
      PDS_PORT: '2583'
      PDS_DEV_MODE: 'true'
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /blobs
      PDS_BLOBSTORE_DISK_TMP_LOCATION: /blobs/tmp
      PDS_BLOB_UPLOAD_LIMIT: '5242880'
      PDS_INVITE_REQUIRED: 'true'
      PDS_RATE_LIMITS_ENABLED: 'true'
      PDS_SERVICE_HANDLE_DOMAINS: .test
      PDS_DID_PLC_URL: http://127.0.0.1:9
      PDS_CRAWLERS: ''
      LOG_ENABLED: 'false'
    volumes:
      - pds-data:/pds
      - pds-blobs:/blobs
    networks: [isolated]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'
  ingress:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - '127.0.0.1:2583:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [isolated, ingress]
    depends_on: [pds]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: 'no'
networks:
  ingress: {}
  isolated:
    internal: true
volumes:
  pds-data:
  pds-blobs:
