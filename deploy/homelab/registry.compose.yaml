services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    environment:
      POSTGRES_USER: pds_staging
      POSTGRES_DB: pds_local
      POSTGRES_PASSWORD: ${PDS_DB_PASSWORD:?private staging registry password required}
    ports: ["127.0.0.1:35435:5432"]
    volumes: ["registry-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pds_staging -d pds_local"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  registry-data:
